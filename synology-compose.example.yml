version: '3.8'
services:
  oc-proxy-downloader:
    image: jshsakura/oc-proxy-downloader:latest  # Docker Hub 이미지 사용
    container_name: oc-proxy-downloader
    
    # Synology NAS 환경 설정
    environment:
      - TZ=Asia/Seoul
      - PUID=1026      # Synology에서 사용자 ID 확인 필요 (Control Panel > User & Group > User > Advanced > User ID)
      - PGID=100       # Synology에서 그룹 ID 확인 필요 (일반적으로 users 그룹은 100)
      
      # 경로 설정
      - DOWNLOAD_PATH=/downloads
      - CONFIG_PATH=/config

      # FlareSolverr 연동 (아래 flaresolverr 서비스로 자동 연결)
      # Cloudflare 인터스티셜이 걸린 호스터(MegaUp/1fichier 폴백 등)에 필요.
      # 별도 컨테이너이므로 localhost 가 아니라 서비스 이름으로 가리켜야 함.
      - FLARESOLVERR_URL=http://flaresolverr:8191
      
      # 인증 설정 (보안을 위해 설정 권장)
      - AUTH_USERNAME=admin                    # 로그인 사용자명
      - AUTH_PASSWORD=your-secure-password     # 강력한 비밀번호로 변경
      - JWT_SECRET_KEY=your-random-secret-key  # 랜덤한 문자열로 변경
      - JWT_EXPIRATION_HOURS=24                # JWT 토큰 만료 시간
      
      # 동시 다운로드 수는 /config/config.json 또는 웹 설정에서 조정
      # max_concurrent_downloads 기본 8, max_per_host_downloads 기본 3
      
    volumes:
      # Synology 경로 예시 - 실제 환경에 맞게 수정 필요
      - /volume1/downloads:/downloads          # 다운로드 저장 폴더
      - /volume1/docker/oc-proxy-downloader/config:/config  # 설정 파일 저장 폴더
      
      # 또는 Docker 폴더 사용 시:
      # - /volume1/docker/oc-proxy-downloader/downloads:/downloads
      # - /volume1/docker/oc-proxy-downloader/config:/config
      
    ports:
      - "8000:8000"    # 웹 인터페이스 포트 (다른 포트 사용 시 변경)
      
    restart: unless-stopped
    
    # 헬스체크 설정
    healthcheck:
      # /api/auth/status is reachable without a token by design; /api/settings
      # returns 401 once AUTH_USERNAME/AUTH_PASSWORD are set, which would mark a
      # perfectly healthy container as unhealthy.
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/auth/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      
    # 리소스 제한 (선택사항 - Synology 성능에 맞게 조정)
    deploy:
      resources:
        limits:
          cpus: '2.0'      # CPU 제한
          memory: 2G       # 브라우저 호스트 파싱을 고려한 예시
        reservations:
          cpus: '0.5'      # CPU 예약
          memory: 256M     # 메모리 예약

  # Cloudflare 챌린지 처리용 FlareSolverr. 호스트별 다운로드 브라우저는 앱 이미지에 포함.
  # 앱과 같은 네트워크에 두어야 cf_clearance 쿠키의 egress IP 가 일치한다.
  # 8191 포트는 앱만 쓰므로 호스트로 노출하지 않는다.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - TZ=Asia/Seoul
      - LOG_LEVEL=info
    restart: unless-stopped

# 네트워크 설정 (선택사항)
networks:
  default:
    driver: bridge

# 볼륨 설정 (선택사항 - Docker 볼륨 사용 시)
